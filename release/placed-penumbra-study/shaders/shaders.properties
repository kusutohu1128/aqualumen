blend.gbuffers_weather=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
alphaTest.gbuffers_weather=GREATER 0.0039

# Camera-local block geometry for placed lights, including off-screen casters.
shadow.culling=reversed
image.lampCellImage=aqualumenRawCells red_integer r32ui unsigned_int true false 512 2560
# Door alpha rows 0..39. Rows 40..103 cache live foliage coverage and sprite chromaticity.
image.doorMaskImage=aqualumenDoorMask red_integer r32ui unsigned_int true false 16 104
image.lampIndexImage=aqualumenRawIndex red_integer r32ui unsigned_int true false 128 1801
image.lampFieldImage=aqualumenLightField red r32f float false false 512 8864
image.lampListImage=aqualumenLightList rgba rgba32f float false false 16 6912

# Row 0 holds eye adaptation; rows 1..1089 hold per-vertex RGB sky access.
image.lampExposureImage=aqualumenLampExposure rg rg32f float false false 198 1090
# Animated entity triangles from shadow_entities, rebuilt every frame for
# local-light visibility. Heads and meta are cleared by Iris before the shadow
# pass; triangle and node records are only reached through this frame's heads.
# Entity metadata uses row 0; 256x256 rain heights fill the remaining 128 rows.
image.entityMetaImage=aqualumenEntityMeta red_integer r32ui unsigned_int true false 512 129
image.entityHeadImage=aqualumenEntityHeads red_integer r32ui unsigned_int true false 1024 864
image.entityNodeImage=aqualumenEntityNodes rgba_integer rgba32ui unsigned_int false false 1024 256
image.entityTriangleImage=aqualumenEntityTriangles rgba_integer rgba32ui unsigned_int false false 1024 96

# Per-frame full-cube reflectance and four directional-face samples of outgoing and incoming radiance.
image.bounceSurfaceImage=aqualumenBounceSurfaces red_integer r32ui unsigned_int true false 768 258
image.bounceExitImage=aqualumenBounceExit rgba rgba16f float false false 1536 1024
image.bounceIncidentImage=aqualumenBounceIncident rgba rgba16f float false false 1536 2048

# Incident rows 0, 512, 1024, and 1536 store first lamp return, solar exit, solar return, and second lamp return.
