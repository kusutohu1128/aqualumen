image.rippleImageB=aqualumenRippleB rg rg32f float false false 512 512
screen=<profile> [WATER] [LIGHT] [QUALITY]
screen.WATER=WAVE_HEIGHT WIND_SPEED WATER_CLARITY WATER_ROUGHNESS SHORE_FOAM
screen.LIGHT=EXPOSURE NIGHT_EXPOSURE LAMP_ADAPTATION LAMP_GLARE LOCAL_BOUNCE RAIN_SURFACES HAZE_DENSITY
